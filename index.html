<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rota Pequim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;500;600;700&family=Oswald:wght@600;700&family=Noto+Serif+SC:wght@900&display=swap">
<style>
/* Layout: tela de login em cartaz de propaganda — raios no topo, emblema central, cartão de acesso embaixo */
:root{
  --paper:#F6F1EA;
  --card:#FFFFFF;
  --ink:#1E1715;
  --muted:#6F625E;
  --line:#E2D6CC;
  --red:#C8102E;
  --red-deep:#8E0B20;
  --gold:#F2B630;
  --gold-deep:#B07A0C;
  --gold-soft:#FBEFD3;
  --f-display:"Bricolage Grotesque", "Figtree", system-ui, sans-serif;
  --f-poster:"Oswald", "Arial Narrow", "Figtree", sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-han:"Noto Serif SC", "Songti SC", "PingFang SC", serif;
  color-scheme:light only;
}
*{box-sizing:border-box}
html,body{background:#E5DDD6;color:var(--ink)}
body{margin:0;font-family:var(--f-body);font-size:15px;line-height:1.45;padding:32px 16px;display:flex;justify-content:center}
.phone{width:100%;max-width:400px;min-height:820px;background:var(--paper);border-radius:40px;border:10px solid #1E1715;overflow:hidden;box-shadow:0 30px 60px -20px rgba(70,20,20,.35);position:relative;display:flex;flex-direction:column}

/* cartaz */
.poster{color:#fff;position:relative;overflow:hidden;padding:18px 20px 70px;text-align:center;
  background:
    radial-gradient(circle at 50% 46%, rgba(255,214,120,.45) 0 14%, transparent 44%),
    repeating-conic-gradient(from 0deg at 50% 46%, #C8102E 0 7.5deg, #A90B24 7.5deg 15deg);}
.poster::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-40px;height:80px;background:var(--paper);border-radius:50% 50% 0 0}
.status{display:flex;justify-content:space-between;font-size:12px;font-weight:600;opacity:.9}
.emblem{position:relative;width:150px;height:150px;margin:22px auto 0}
.emblem .star{position:absolute;inset:0;width:100%;height:100%;fill:#fff;filter:drop-shadow(0 8px 16px rgba(80,0,10,.4))}
.emblem .hs{position:absolute;left:50%;top:52%;width:58px;height:58px;transform:translate(-50%,-50%)}
.emblem .hs{fill:var(--red)}
.poster h1{position:relative;z-index:1;margin:14px 0 0;font-family:var(--f-poster);font-weight:700;font-size:40px;line-height:1;letter-spacing:.03em;text-transform:uppercase;text-shadow:3px 3px 0 var(--red-deep)}
.poster .han{position:relative;z-index:1;font-family:var(--f-han);font-weight:900;font-size:22px;color:var(--gold);letter-spacing:.2em;margin-top:6px}
.poster .tag{position:relative;z-index:1;display:inline-block;margin-top:10px;background:var(--gold);color:var(--red-deep);font-family:var(--f-poster);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:12px;padding:4px 12px;border:2px solid var(--red-deep)}

/* acesso */
.access{flex:1;padding:0 20px 24px;margin-top:-18px;position:relative;z-index:2;display:flex;flex-direction:column;gap:14px}
.access h2{font-family:var(--f-display);font-weight:800;font-size:22px;margin:0;text-align:center;text-wrap:balance}
.access h2 + p{margin:-8px 0 0;text-align:center;color:var(--muted);font-size:14px}
form{display:flex;flex-direction:column;gap:12px}
.field label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--red-deep);margin-bottom:5px}
.field .box{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:0 14px;transition:border-color .15s}
.field .box:focus-within{border-color:var(--red);box-shadow:0 0 0 4px rgba(200,16,46,.12)}
.field .ico{font-family:var(--f-han);font-weight:900;color:var(--red);font-size:16px;flex:none}
.field input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;font-size:16px;padding:13px 0;color:var(--ink)}
.field input::placeholder{color:#A99B95}
.row{display:flex;justify-content:space-between;align-items:center;font-size:13px}
.row label{display:flex;align-items:center;gap:6px;color:var(--muted)}
.row input{accent-color:var(--red)}
.row a{color:var(--red);font-weight:600;text-decoration:none}

.btn{position:relative;overflow:hidden;border:0;border-radius:99px;padding:15px 20px;font-family:var(--f-poster);font-weight:700;font-size:18px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.btn svg{width:22px;height:22px}
.btn-main{background:var(--red);color:#fff;box-shadow:0 0 0 3px var(--gold),0 10px 26px -6px rgba(200,16,46,.7)}
.btn-main svg{fill:var(--gold)}
.btn-main::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg)}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:4px}

.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.alts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alt{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:11px 8px;font:inherit;font-size:13px;font-weight:700;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.alt .ico{font-family:var(--f-han);font-weight:900;color:var(--red)}
.alt:hover{border-color:var(--red)}

.msg{min-height:20px;margin:0;text-align:center;font-size:13px;font-weight:600;color:var(--red-deep)}
.signup{text-align:center;font-size:14px;color:var(--muted);margin:0}
.signup a{color:var(--red);font-weight:700;text-decoration:none}
.foot{text-align:center;font-size:11px;color:var(--muted);margin:auto 0 0}
.foot .han{font-family:var(--f-han);font-weight:900;color:var(--red);letter-spacing:.1em}

@media (max-width:440px){
  body{padding:0}
  .phone{border:0;border-radius:0;max-width:none;box-shadow:none;min-height:100vh}
}
@media (prefers-reduced-motion:no-preference){
  .emblem{animation:rise .9s cubic-bezier(.2,.8,.2,1.2) both}
  @keyframes rise{from{transform:translateY(20px) scale(.85)}}
  .emblem .star{animation:spin 30s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .btn-main::after{animation:shine 3.2s ease-in-out infinite}
  @keyframes shine{0%,55%{left:-60%}100%{left:130%}}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="hs" viewBox="0 0 100 100">
    <path d="M60 10c22 6 34 28 28 50-6 21-27 34-49 30l-9 11-8-7 9-10C24 76 18 62 20 48c6 14 20 24 36 22 18-2 30-18 28-36-1-10-10-20-24-24z"/>
    <path d="M22 16l14-12 14 14-6 5 40 44-9 8-40-44-6 5z"/>
  </symbol>
  <symbol id="star" viewBox="0 0 24 24"><path d="M12 1.8l2.9 7.1 7.6.5-5.9 4.9 1.9 7.4L12 17.6l-6.5 4.1 1.9-7.4-5.9-4.9 7.6-.5z"/></symbol>
</svg>

<div class="phone">
  <header class="poster">
    <div class="status"><span>9:41</span><span>5G · 87%</span></div>
    <div class="emblem" aria-hidden="true">
      <svg class="star"><use href="#star"/></svg>
      <svg class="hs"><use href="#hs"/></svg>
    </div>
    <h1>Rota Pequim</h1>
    <div class="han">北京之路</div>
    <span class="tag">Mandarim de malas prontas</span>
  </header>

  <main class="access">
    <h2><span style="font-family:var(--f-han);color:var(--red)">你好，同志！</span><br>Bem-vindo de volta</h2>
    <p>Entre para continuar seu plano quinquenal de estudos.</p>

    <form id="login" novalidate>
      <div class="field">
        <label for="email">E-mail do companheiro</label>
        <div class="box"><span class="ico" aria-hidden="true">邮</span><input id="email" type="email" placeholder="voce@exemplo.com" autocomplete="email"></div>
      </div>
      <div class="field">
        <label for="senha">Senha do partido</label>
        <div class="box"><span class="ico" aria-hidden="true">密</span><input id="senha" type="password" placeholder="Mínimo 8 caracteres" autocomplete="current-password"></div>
      </div>
      <div class="row">
        <label for="lembrar"><input id="lembrar" type="checkbox" checked> Lembrar de mim</label>
        <a href="#">Esqueci a senha</a>
      </div>
      <button class="btn btn-main" type="submit"><svg aria-hidden="true"><use href="#hs"/></svg>Entrar · 进入</button>
      <p class="msg" id="msg" role="status"></p>
    </form>

    <div class="or">ou entre com</div>
    <div class="alts">
      <button class="alt" type="button" id="alt1"><span class="ico">护</span>Passaporte</button>
      <button class="alt" type="button" id="alt2"><span class="ico">签</span>Visto</button>
    </div>

    <p class="signup">Ainda não se alistou? <a href="#">Criar conta</a></p>
    <p class="foot"><span class="han">全世界无产者，联合起来！</span><br>Página de humor. Sem qualquer vínculo com partido político.</p>
  </main>
</div>

<script>
const msg=document.getElementById('msg');
document.getElementById('login').addEventListener('submit',e=>{
  e.preventDefault();
  const email=document.getElementById('email').value.trim();
  const senha=document.getElementById('senha').value;
  if(!email||!senha){msg.textContent='Preencha e-mail e senha, companheiro.';return;}
  msg.textContent='Acesso liberado. Embarcando…';
  setTimeout(()=>{location.href='inicio.html'},700);
});
['alt1','alt2'].forEach(id=>document.getElementById(id).addEventListener('click',()=>{
  msg.textContent='Carimbo aprovado. Embarcando…';
  setTimeout(()=>{location.href='inicio.html'},700);
}));
</script>
</body>
</html>
